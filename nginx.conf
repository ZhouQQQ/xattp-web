map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
   #  listen 443 ssl;
   #  server_name ttp.xiaoantech.com;
    
    # SSL 配置，如果还没有证书，需要先配置
    # ssl_certificate /path/to/your/fullchain.pem;
    # ssl_certificate_key /path/to/your/privkey.pem;
    
    root /usr/share/nginx/html;
    index index.html;
    # 默认超时统一设置为 10 分钟
    proxy_connect_timeout 10m;
    proxy_send_timeout 10m;
    proxy_read_timeout 10m;
    send_timeout 10m;

    # 将 HTTP 请求重定向到 HTTPS
   #  if ($scheme != "https") {
   #      return 301 https://$server_name$request_uri;
   #  }

    # 优先匹配 /xath/ 路径，确保代理到 xath-doc 服务
    location ^~ /xath/ {      
        proxy_pass http://xath-doc/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        # 禁止缓存
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires off;
    }

    location /xattp-auth/ {     
        proxy_pass http://xattp-auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }   
    
    location /xattp-server/ {
        proxy_pass http://xattp-server/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location /traffic-inspector/ {
        proxy_pass http://xattp-traffic-inspector/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
    }

    # WebSocket：wss://ttp.xiaoantech.com/ws → xattp-traffic-inspector（TLS 由前置网关终结）
    location /ws {
        proxy_pass http://xattp-traffic-inspector;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
    }

    # 默认路由，处理前端 SPA
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires off;
        try_files $uri $uri/ /index.html;
    }
}

upstream xath-doc {
    server xath-doc:80;
}

upstream xattp-auth {
    server xattp-auth:8889;
}

upstream xattp-server {
    server xattp-server:8890;
}


upstream xattp-traffic-inspector {
    server xattp-traffic-inspector:9876;
}
